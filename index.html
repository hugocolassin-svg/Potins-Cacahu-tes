#stage{perspective:1600px}
.page{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);padding:26px 24px;transform-origin:left center;transition:transform .45s ease-in,opacity .45s;position:relative}
.page.out{transform:rotateY(-100deg);opacity:.2}
.page.in{animation:pin .5s ease-out}
@keyframes pin{from{transform:rotateY(35deg) scale(.97);opacity:0}to{transform:none;opacity:1}}
h1,h2{font-family:'Chonburi',serif;font-weight:400;margin:0 0 10px;line-height:1.2}
h1{font-size:1.7rem}h2{font-size:1.35rem}
p{margin:0 0 12px}
.rules{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:10px}
.rules li{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:11px 14px 11px 48px;position:relative}
.rules li b.n{position:absolute;left:11px;top:10px;width:27px;height:27px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);display:grid;place-items:center;font-size:.9rem}
.rules li.warn{background:#ffe3f1}
.btn{font:800 1.05rem 'Nunito',sans-serif;background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{display:block;width:100%;font-size:1.7rem;font-family:'Chonburi',serif;font-weight:400;padding:18px}
.btn.alt{background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
input[type=text],input[type=password],textarea{width:100%;font:600 1.05rem 'Nunito',sans-serif;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{min-height:46vh;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:3px solid var(--pink)}
.hint{font-size:.92rem;color:#5b5266}
.err{color:#b00057;font-weight:800;min-height:1.4em;margin-top:8px}
.foot{text-align:center;margin-top:22px}
.foot a{color:var(--ink);opacity:.75;font-size:.85rem;cursor:pointer;background:#fffaf3cc;padding:5px 12px;border-radius:99px;border:2px solid var(--ink);text-decoration:none}
.list{display:grid;gap:10px;margin-top:14px}
.item{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.item:hover{transform:translate(-2px,-2px);background:#ffe3f1}
.item small{font-weight:700;color:#5b5266;white-space:nowrap}
.story{white-space:pre-wrap;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;margin:12px 0 18px;overflow-wrap:anywhere}
.tea{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin:6px 0}
.tea button{all:unset;cursor:pointer;width:34px;height:30px;color:#cfc9ee;transition:transform .12s,filter .12s}
.tea button svg{width:100%;height:100%;display:block;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.tea button:hover{transform:scale(1.18) rotate(-6deg)}
.tea button.on{color:#fff;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 3px #f9c6e1)}
.score{font:400 1.4rem 'Chonburi',serif;margin-left:10px}
.back{background:none;border:0;font:800 .95rem 'Nunito';cursor:pointer;text-decoration:underline;color:var(--ink);padding:0;margin-bottom:10px}
.big-emoji{font-size:3rem;text-align:center}
</style></head><body>

<div id="stage"><div class="page" id="page"></div></div>
<div class="foot" id="foot"><a id="adm">🔑 Admin</a></div>
</div>
<script>
const $=s=>document.querySelector(s), pg=$("#page");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SB_URL="https://TON-PROJET.supabase.co", SB_KEY="TA-CLE-ANON-PUBLIQUE";
const ready=()=>!SB_URL.includes("TON-PROJET");
let cur={id:null,title:"",text:""},stories={},ratings=[],openId=null,admin=false,uid;
try{uid=localStorage.getItem("pc_voter");if(!uid){uid="v"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("pc_voter",uid)}}catch(e){uid=uid||"v"+Math.random().toString(36).slice(2)}
async function api(path,opt={}){const r=await fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",...(opt.headers||{})}});if(!r.ok)throw new Error(r.status);const x=await r.text();return x?JSON.parse(x):null}

function turn(fn){pg.classList.add("out");setTimeout(()=>{fn();pg.classList.remove("out");pg.classList.add("in");window.scrollTo({top:0});setTimeout(()=>pg.classList.remove("in"),520)},430)}

function home(){cur={id:null,title:"",text:""};$("#foot").style.display="";pg.innerHTML=`
<h1>Bienvenue chez les Potins ☕</h1>
<p>Ici, on dépose ses histoires : les meilleures anecdotes, les plus gros fails, les moments qu’on n’oubliera jamais. Les titres feront saliver la bande, alors soigne ton récit.</p>
<ul class="rules">
<li><b class="n">1</b><b>Raconte en détail.</b> On doit comprendre toute l’histoire sans y avoir été : le contexte, qui était là, ce qui s’est passé, comment ça s’est fini.</li>
<li><b class="n">2</b><b>Aucun vrai nom.</b> Change tous les prénoms, et le tien aussi. Invente, déguise, mélange.</li>
<li><b class="n">3</b><b>Tout est anonyme.</b> Personne ne doit pouvoir deviner qui a écrit quoi.</li>
<li><b class="n">4</b><b>Un titre accrocheur.</b> C’est lui qui donnera envie de lire ton histoire en premier.</li>
<li class="warn"><b class="n">!</b><b>Tu n’es pas de la bande ?</b> Ce lien est privé et s’est glissé jusqu’à toi par erreur. Merci de fermer la page, de ne rien écrire et de ne pas le partager. Si tu connais la personne qui te l’a transmis, dis-lui de ta part qu’il fallait faire attention.</li>
</ul>
<button class="btn big" id="go">Mon histoire</button>`;
$("#go").onclick=()=>turn(titleStep)}

function titleStep(){$("#foot").style.display="none";pg.innerHTML=`
<h2>${cur.id?"Modifier le titre":"Le titre de ton histoire"}</h2>
<p class="hint">Obligatoire. Trouve un titre qui donne envie : c’est avec lui qu’on choisira ton histoire.</p>
<input type="text" id="t" placeholder="Ex. : La nuit où la baignoire a disparu" value="${esc(cur.title)}" maxlength="140">
<div class="row"><button class="btn alt" id="b">← Retour</button><button class="btn" id="n" disabled>Tourner la page →</button></div>`;
const t=$("#t"),n=$("#n"),chk=()=>n.disabled=!t.value.trim();t.oninput=chk;chk();t.focus();
$("#b").onclick=()=>turn(home);n.onclick=()=>{cur.title=t.value.trim();turn(storyStep)};
t.onkeydown=e=>{if(e.key==="Enter"&&!n.disabled)n.click()}}

function storyStep(){pg.innerHTML=`
<h2>${esc(cur.title)}</h2>
<p class="hint">Raconte tout, sans limite de longueur. Rappel : aucun vrai prénom, ni les autres, ni le tien.</p>
<textarea id="s" placeholder="Il était une fois…">${esc(cur.text)}</textarea>
<div class="err" id="e"></div>
<div class="row"><button class="btn alt" id="b">← Le titre</button><button class="btn" id="n" disabled>Déposer mon histoire</button></div>`;
const s=$("#s"),n=$("#n"),chk=()=>n.disabled=!s.value.trim();s.oninput=chk;chk();
$("#b").onclick=()=>{cur.text=s.value;turn(titleStep)};
n.onclick=async()=>{if(!ready()){$("#e").textContent="Le site n’est pas encore relié à sa base de données.";return}
n.disabled=true;n.textContent="Envoi…";cur.text=s.value.trim();
try{const d={title:cur.title,text:cur.text};
if(cur.id){await api("stories?id=eq."+cur.id,{method:"PATCH",body:JSON.stringify({...d,edited_at:new Date().toISOString()})})}
else{const r=await api("stories",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(d)});cur.id=r[0].id}
turn(done)}catch(e){$("#e").textContent="Oups, l’envoi a échoué. Réessaie dans un instant.";n.disabled=false;n.textContent="Déposer mon histoire"}}}

function done(){pg.innerHTML=`<div class="big-emoji">🥜</div><h2 style="text-align:center">Merci, c’est déposé !</h2>
<p style="text-align:center">Ton histoire « ${esc(cur.title)} » est bien arrivée, en toute discrétion.</p>
<div class="row" style="justify-content:center"><button class="btn alt" id="m">✏️ Modifier mon histoire</button><button class="btn" id="w">Écrire une nouvelle histoire</button></div>`;
$("#m").onclick=()=>turn(titleStep);$("#w").onclick=()=>turn(()=>{cur={id:null,title:"",text:""};titleStep()})}

/* ---------- admin ---------- */
$("#adm").onclick=()=>turn(()=>{admin?adminList():login()});
function login(){$("#foot").style.display="none";pg.innerHTML=`<h2>Espace admin 🔑</h2><p class="hint">Entre le code secret.</p>
<input type="password" id="c" placeholder="Code" autocomplete="off"><div class="err" id="e"></div>
<div class="row"><button class="btn alt" id="b">← Retour</button><button class="btn" id="n">Entrer</button></div>`;
const c=$("#c"),ok=()=>{if(c.value.trim().toLowerCase()==="larousse"){admin=true;turn(adminList)}else{$("#e").textContent="Code incorrect.";c.select()}};
$("#n").onclick=ok;c.onkeydown=e=>{if(e.key==="Enter")ok()};$("#b").onclick=()=>turn(home);c.focus()}

async function load(){try{const[s,r]=await Promise.all([api("stories?select=*&order=created_at.desc"),api("ratings?select=*")]);stories={};s.forEach(x=>stories[x.id]=x);ratings=r;return true}catch(e){return false}}
function stats(id){const v=ratings.filter(r=>r.story_id==id),m=v.find(r=>r.voter===uid);return{n:v.length,avg:v.length?v.reduce((a,r)=>a+r.value,0)/v.length:0,mine:m?m.value:0}}

async function adminList(){openId=null;$("#foot").style.display="none";pg.innerHTML=`<h2>Toutes les histoires 📚</h2>
<p class="hint">Clique sur un titre pour lire l’histoire.</p><div class="list" id="list"><p class="hint">Chargement…</p></div>
<div class="row"><button class="btn alt" id="b">← Quitter l’admin</button></div>`;
$("#b").onclick=()=>{admin=false;turn(home)};
const ok=ready()&&await load();drawList(ok)}
function drawList(ok){const a=Object.values(stories).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
$("#list").innerHTML=a.length?a.map(s=>{const st=stats(s.id);return`<button class="item" data-id="${s.id}"><span>${esc(s.title)}</span><small>${st.n?"🫖 "+st.avg.toFixed(1).replace(".0","")+"/10":""}</small></button>`}).join(""):`<p class="hint">${ok?"Aucune histoire pour l’instant.":"Impossible de charger les histoires pour le moment."}</p>`;
document.querySelectorAll(".item").forEach(b=>b.onclick=()=>turn(()=>readStory(b.dataset.id)))}

function readStory(id){openId=id;const s=stories[id];if(!s){adminList();return}
pg.innerHTML=`<button class="back" id="b">← Toutes les histoires</button><h1>${esc(s.title)}</h1>
<div class="story">${esc(s.text)}</div><h2 style="font-size:1.1rem">Ta note</h2><div id="tea"></div>`;
$("#b").onclick=()=>turn(adminList);drawTea()}
function drawTea(){const id=openId,st=stats(id);let h='<div class="tea">';
for(let i=1;i<=10;i++)h+=`<button data-i="${i}" class="${i<=st.mine?"on":""}" aria-label="${i} sur 10"><svg><use href="#tp"/></svg></button>`;
h+=`<span class="score">${st.mine?st.mine:"–"}/10</span></div><p class="hint">${st.n?`Moyenne de la bande : ${st.avg.toFixed(1).replace(".",",")}/10 (${st.n} note${st.n>1?"s":""})`:"Pas encore de note."}</p>`;
$("#tea").innerHTML=h;
document.querySelectorAll("#tea button").forEach(b=>b.onclick=async()=>{const v=+b.dataset.i;try{await api("ratings?on_conflict=story_id,voter",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({story_id:+id,voter:uid,value:v})});ratings=ratings.filter(r=>!(r.story_id==id&&r.voter===uid)).concat({story_id:+id,voter:uid,value:v});drawTea()}catch(e){}})}
home();
</script></body></html>
